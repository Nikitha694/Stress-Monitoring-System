<!DOCTYPE html>
<html>

<head>
    <title>Stress Prediction</title>
</head>

<body>

<h1>Stress Monitoring System</h1>

<form action="/predict" method="POST">

<label>Age</label><br>
<input type="number" name="Age"><br><br>

<label>Sleep Duration</label><br>
<input type="number" step="0.1" name="Sleep_Duration"><br><br>

<label>Work Hours</label><br>
<input type="number" name="Work_Hours"><br><br>

<input type="submit" value="Predict">

</form>

</body>
</html>
